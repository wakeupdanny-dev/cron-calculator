<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cron-калькулятор для бота смены доменов</title>
<style>
  :root {
    --bg: #f4f4f7;
    --card: #ffffff;
    --text: #1a1a2e;
    --muted: #6b6b80;
    --accent: #3b6ef6;
    --accent-soft: #e8eefe;
    --accent-text: #ffffff;
    --border: #e2e2ea;
    --code-bg: #f0f1f6;
    --ok: #1c8a4b;
    --ok-bg: #e6f7ec;
    --err: #d8434b;
    --err-bg: #fdecee;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14141f;
      --card: #1e1e2e;
      --text: #f0f0f5;
      --muted: #9a9ab0;
      --accent: #6f9bff;
      --accent-soft: #22304f;
      --accent-text: #0d0d16;
      --border: #33334a;
      --code-bg: #26263a;
      --ok: #4fd888;
      --ok-bg: #16301f;
      --err: #ff7b83;
      --err-bg: #3a1c20;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-inline: 16px;
    padding-block: 32px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 16px;
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .step {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .options { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
  .options .field { min-width: 120px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .field input {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .field input.invalid { border-color: var(--err); background: var(--err-bg); }
  .field .fmsg { color: var(--err); font-size: 12px; margin-top: 3px; min-height: 0; }
  .days { display: flex; gap: 6px; flex-wrap: wrap; }
  .day {
    width: 42px;
    padding: 8px 0;
    text-align: center;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
  }
  .day.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .hidden { display: none !important; }

  .result {
    margin-top: 20px;
    padding: 16px 18px;
    background: var(--accent-soft);
    border-radius: 12px;
  }
  .human { font-size: 20px; font-weight: 600; line-height: 1.3; min-height: 26px; }
  .cron-line { margin-top: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cron-code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 15px;
    background: var(--card);
    border-radius: 8px;
    padding: 8px 12px;
    flex: 1 1 auto;
    min-width: 180px;
  }
  button.copy {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
  }
  button.copy:active { opacity: .8; }
  .error { color: var(--err); font-size: 14px; margin-top: 10px; }
  .runs { margin-top: 16px; }
  .runs h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  .runs ul { margin: 0; padding: 0; list-style: none; }
  .runs li {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .runs li:last-child { border-bottom: none; }
  .runs .rel { color: var(--muted); text-align: right; }


  .bot-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .bot-fields { grid-template-columns: 1fr; } }
  .bot-fields .field.wide { grid-column: 1 / -1; }
  .command-box {
    background: var(--code-bg);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    word-break: break-all;
  }
  .hint { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ok-bg);
    color: var(--ok);
    border: 1px solid var(--ok);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <h1>⏰ Cron-калькулятор</h1>
  <p class="subtitle">Выберите, как часто менять домен — получите готовую команду для бота.</p>

  <div class="card">
    <h2><span class="step">1</span> Когда менять домен</h2>

    <div class="chips" id="modes">
      <button class="chip" data-mode="daily">Каждый день</button>
      <button class="chip" data-mode="weekdays">По будням</button>
      <button class="chip" data-mode="weekend">По выходным</button>
      <button class="chip" data-mode="weekly">По дням недели</button>
      <button class="chip" data-mode="monthly">Раз в месяц</button>
      <button class="chip" data-mode="hours">Каждые N часов</button>
      <button class="chip" data-mode="minutes">Каждые N минут</button>
    </div>

    <div class="options">
      <div class="field" data-for="daily weekdays weekend weekly monthly">
        <label>Время</label>
        <input type="time" id="o-time" value="06:00">
      </div>
      <div class="field hidden" data-for="weekly">
        <label>Дни недели</label>
        <div class="days" id="o-days">
          <button class="day" data-d="1">Пн</button>
          <button class="day" data-d="2">Вт</button>
          <button class="day" data-d="3">Ср</button>
          <button class="day" data-d="4">Чт</button>
          <button class="day" data-d="5">Пт</button>
          <button class="day" data-d="6">Сб</button>
          <button class="day" data-d="0">Вс</button>
        </div>
      </div>
      <div class="field hidden" data-for="monthly">
        <label>Число месяца (1–31)</label>
        <input type="number" id="o-dom" min="1" max="31" value="1">
      </div>
      <div class="field hidden" data-for="hours minutes">
        <label id="o-n-label">Каждые (часов)</label>
        <input type="number" id="o-n" min="1" max="59" value="6">
      </div>
    </div>

    <div class="result">
      <div class="human" id="human-out"></div>
      <div class="cron-line">
        <div class="cron-code" id="cron-out">0 6 * * *</div>
        <button class="copy" data-copy="#cron-out">Скопировать</button>
      </div>
      <div class="error" id="error-out"></div>

      <div class="runs" id="runs-block">
        <h3>Ближайшие срабатывания</h3>
        <ul id="runs-list"></ul>
      </div>
    </div>

    <input type="hidden" id="f-min" value="0">
    <input type="hidden" id="f-hour" value="6">
    <input type="hidden" id="f-dom" value="*">
    <input type="hidden" id="f-mon" value="*">
    <input type="hidden" id="f-dow" value="*">
  </div>

  <div class="card">
    <h2><span class="step">2</span> Что менять</h2>
    <div class="bot-fields">
      <div class="field"><label>тенант</label><input id="b-tenant" value="mon_ru_nutra"></div>
      <div class="field"><label>текущий домен</label><input id="b-old" value="globalnewswire.rest"></div>
      <div class="field wide"><label>новый домен (можно несколько через запятую)</label><input id="b-new" value="new-domain.com"></div>
    </div>
  </div>

  <div class="card">
    <h2><span class="step">3</span> Команда для бота</h2>
    <div class="command-box" id="command-out"></div>
    <div class="cron-line" style="margin-top:12px">
      <button class="copy" data-copy="#command-out">Скопировать команду</button>
    </div>
    <div class="hint">Вставьте эту команду в чат с ботом (Element) — она создаст расписание.</div>
  </div>
</div>

<div class="toast" id="toast">Скопировано</div>

<script>
'use strict';

const MONTHS = ["", "январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
const MONTHS_PREP = ["", "январе", "феврале", "марте", "апреле", "мае", "июне", "июле", "августе", "сентябре", "октябре", "ноябре", "декабре"];
const WEEKDAYS = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
const WEEKDAYS_DAT = ["воскресеньям", "понедельникам", "вторникам", "средам", "четвергам", "пятницам", "субботам"];

function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

const els = {
  min: document.getElementById('f-min'),
  hour: document.getElementById('f-hour'),
  dom: document.getElementById('f-dom'),
  mon: document.getElementById('f-mon'),
  dow: document.getElementById('f-dow'),
  cronOut: document.getElementById('cron-out'),
  humanOut: document.getElementById('human-out'),
  errorOut: document.getElementById('error-out'),
  runsBlock: document.getElementById('runs-block'),
  runsList: document.getElementById('runs-list'),
  bTenant: document.getElementById('b-tenant'),
  bOld: document.getElementById('b-old'),
  bNew: document.getElementById('b-new'),
  commandOut: document.getElementById('command-out'),
  toast: document.getElementById('toast'),
  time: document.getElementById('o-time'),
  odom: document.getElementById('o-dom'),
  n: document.getElementById('o-n'),
  nLabel: document.getElementById('o-n-label'),
};

const state = { mode: 'daily', days: new Set([1]), daysTouched: false };

function parseField(raw, min, max, names) {
  const set = new Set();
  const parts = raw.split(',').map(s => s.trim()).filter(Boolean);
  if (parts.length === 0) throw new Error('поле пустое');
  for (const part of parts) {
    let body = part, step = 1;
    const stepMatch = body.match(/^(.*)\/(\d+)$/);
    if (stepMatch) { body = stepMatch[1]; step = parseInt(stepMatch[2], 10); if (!step) throw new Error(`шаг 0 в "${part}"`); }
    let lo = min, hi = max;
    if (body !== '*') {
      const rangeMatch = body.match(/^(\d+|[a-zA-Zа-яА-Я]+)-(\d+|[a-zA-Zа-яА-Я]+)$/);
      if (rangeMatch) {
        lo = resolveName(rangeMatch[1], names);
        hi = resolveName(rangeMatch[2], names);
      } else {
        lo = hi = resolveName(body, names);
      }
    }
    if (lo < min || hi > max || lo > hi) throw new Error(`значение вне диапазона в "${part}" (${min}-${max})`);
    for (let v = lo; v <= hi; v += step) set.add(v);
  }
  return set;
}

function resolveName(token, names) {
  if (/^\d+$/.test(token)) return parseInt(token, 10);
  if (names) {
    const idx = names.findIndex(n => n && n.toLowerCase().startsWith(token.toLowerCase()));
    if (idx >= 0) return idx;
  }
  throw new Error(`не понимаю значение "${token}"`);
}

function buildCron() {
  return [els.min.value.trim(), els.hour.value.trim(), els.dom.value.trim(), els.mon.value.trim(), els.dow.value.trim()].join(' ');
}

function stepOf(raw) {
  const m = raw.match(/^\*\/(\d+)$/);
  return m ? parseInt(m[1], 10) : null;
}

function humanReadable(minSet, hourSet, minRaw, hourRaw, domRaw, monRaw, dowRaw) {
  const parts = [];
  let interval = false;

  const minStep = stepOf(minRaw);
  const hourStep = stepOf(hourRaw);

  if (minStep && hourRaw === '*') {
    interval = true;
    parts.push(minStep === 1 ? 'каждую минуту' : `каждые ${minStep} ${plural(minStep, 'минуту', 'минуты', 'минут')}`);
  } else if (hourStep && minSet.size === 1) {
    interval = true;
    const m = [...minSet][0];
    const base = hourStep === 1 ? 'каждый час' : `каждые ${hourStep} ${plural(hourStep, 'час', 'часа', 'часов')}`;
    parts.push(m === 0 ? base : `${base}, на ${m}-й минуте`);
  } else if (minSet.size === 1 && hourSet.size === 1) {
    const m = [...minSet][0], h = [...hourSet][0];
    parts.push(`в ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
  } else if (hourSet.size === 24 && minSet.size < 60) {
    const mins = [...minSet].sort((a,b)=>a-b);
    parts.push(`в ${plural(mins.length, 'минуту', 'минуты', 'минуты')} ${mins.join(', ')} каждого часа`);
  } else {
    parts.push(`в выбранное время (${hourSet.size} ${plural(hourSet.size, 'час', 'часа', 'часов')} × ${minSet.size} ${plural(minSet.size, 'минута', 'минуты', 'минут')} в каждом)`);
  }

  const domAny = domRaw === '*';
  const monAny = monRaw === '*';
  const dowAny = dowRaw === '*';

  if (domAny && monAny && dowAny) {
    if (!interval) parts.push('каждый день');
  } else {
    if (!dowAny) {
      const dowSet = parseField(dowRaw, 0, 6, WEEKDAYS);
      const key = [...dowSet].sort((a,b)=>a-b).join(',');
      if (key === '1,2,3,4,5') parts.push('по будням');
      else if (key === '0,6') parts.push('по выходным');
      else parts.push('по ' + [...dowSet].sort((a,b)=>a-b).map(d => WEEKDAYS_DAT[d]).join(', '));
    }
    if (!domAny) {
      const domSet = parseField(domRaw, 1, 31, null);
      parts.push('каждого месяца, ' + [...domSet].sort((a,b)=>a-b).join(', ') + '-го числа');
    }
    if (!monAny) {
      const monSet = parseField(monRaw, 1, 12, MONTHS);
      parts.push('в ' + [...monSet].sort((a,b)=>a-b).map(m => MONTHS_PREP[m]).join(', '));
    }
  }

  return parts.join(' ').replace(/^./, c => c.toUpperCase());
}

function nextRuns(minSet, hourSet, domSet, monSet, dowSet, domRaw, dowRaw, count) {
  const domRestricted = domRaw !== '*';
  const dowRestricted = dowRaw !== '*';
  const results = [];
  let d = new Date();
  d.setSeconds(0, 0);
  d.setMinutes(d.getMinutes() + 1);
  const limit = 366 * 24 * 60;
  let steps = 0;
  while (results.length < count && steps < limit) {
    steps++;
    const dow = d.getDay();
    const domOk = domSet.has(d.getDate());
    const dowOk = dowSet.has(dow);
    const dateOk = domRestricted && dowRestricted ? (domOk || dowOk) : (domOk && dowOk);
    if (monSet.has(d.getMonth() + 1) && dateOk && hourSet.has(d.getHours()) && minSet.has(d.getMinutes())) {
      results.push(new Date(d));
    }
    d.setMinutes(d.getMinutes() + 1);
  }
  return results;
}

function fmtDate(d) {
  const days = ["вс","пн","вт","ср","чт","пт","сб"];
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())} (${days[d.getDay()]})`;
}

function fmtRel(d) {
  const mins = Math.max(1, Math.round((d.getTime() - Date.now()) / 60000));
  const days = Math.floor(mins / 1440);
  const hours = Math.floor((mins % 1440) / 60);
  const m = mins % 60;
  const out = [];
  if (days) out.push(`${days} ${plural(days, 'день', 'дня', 'дней')}`);
  if (hours) out.push(`${hours} ${plural(hours, 'час', 'часа', 'часов')}`);
  if (m && !days) out.push(`${m} ${plural(m, 'минуту', 'минуты', 'минут')}`);
  return 'через ' + out.join(' ');
}

function setFieldError(input, msg) {
  input.classList.toggle('invalid', !!msg);
  const box = input.parentElement.querySelector('.fmsg');
  if (box) box.textContent = msg || '';
}

function render() {
  const cron = buildCron();
  els.cronOut.textContent = cron;

  const minRaw = els.min.value.trim();
  const hourRaw = els.hour.value.trim();
  const domRaw = els.dom.value.trim();
  const monRaw = els.mon.value.trim();
  const dowRaw = els.dow.value.trim();

  const specs = [
    [els.min, minRaw, 0, 59, null],
    [els.hour, hourRaw, 0, 23, null],
    [els.dom, domRaw, 1, 31, null],
    [els.mon, monRaw, 1, 12, MONTHS],
    [els.dow, dowRaw, 0, 6, WEEKDAYS],
  ];
  const sets = [];
  let firstError = null;
  for (const [input, raw, lo, hi, names] of specs) {
    try {
      sets.push(parseField(raw, lo, hi, names));
      setFieldError(input, '');
    } catch (e) {
      sets.push(null);
      setFieldError(input, e.message);
      if (!firstError) firstError = e.message;
    }
  }

  if (firstError) {
    els.errorOut.textContent = '⚠️ ' + firstError;
    els.humanOut.textContent = 'Проверьте значения';
    els.runsBlock.classList.add('hidden');
  } else {
    const [minSet, hourSet, domSet, monSet, dowSet] = sets;
    els.errorOut.textContent = '';
    els.humanOut.textContent = humanReadable(minSet, hourSet, minRaw, hourRaw, domRaw, monRaw, dowRaw);

    const runs = nextRuns(minSet, hourSet, domSet, monSet, dowSet, domRaw, dowRaw, 5);
    els.runsList.innerHTML = '';
    if (runs.length === 0) {
      els.runsList.innerHTML = '<li>не удалось найти ближайшие срабатывания (слишком редкое расписание?)</li>';
    } else {
      for (const r of runs) {
        const li = document.createElement('li');
        const a = document.createElement('span');
        a.textContent = fmtDate(r);
        const b = document.createElement('span');
        b.className = 'rel';
        b.textContent = fmtRel(r);
        li.append(a, b);
        els.runsList.appendChild(li);
      }
    }
    els.runsBlock.classList.remove('hidden');
  }

  renderCommand(cron);
}

function renderCommand(cron) {
  const tenant = els.bTenant.value.trim() || '<тенант>';
  const oldD = els.bOld.value.trim() || '<текущий_домен>';
  const newD = els.bNew.value.trim() || '<новый_домен>';
  els.commandOut.textContent = `!schedule_add ${tenant} ${oldD} ${newD} ${cron}`;
}

function clampInt(el, lo, hi, fallback) {
  const v = parseInt(el.value, 10);
  return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : fallback;
}

function applyPreset() {
  const [hh, mm] = (els.time.value || '06:00').split(':').map(Number);
  let min = String(mm), hour = String(hh), dom = '*', dow = '*';
  switch (state.mode) {
    case 'weekdays': dow = '1-5'; break;
    case 'weekend': dow = '0,6'; break;
    case 'weekly': dow = [...state.days].sort((a,b)=>a-b).join(',') || '1'; break;
    case 'monthly': dom = String(clampInt(els.odom, 1, 31, 1)); break;
    case 'hours': min = '0'; hour = `*/${clampInt(els.n, 1, 23, 6)}`; break;
    case 'minutes': min = `*/${clampInt(els.n, 1, 59, 15)}`; hour = '*'; break;
  }
  els.min.value = min;
  els.hour.value = hour;
  els.dom.value = dom;
  els.mon.value = '*';
  els.dow.value = dow;
  render();
}

function syncModeUI() {
  document.querySelectorAll('#modes .chip').forEach(c => c.classList.toggle('active', c.dataset.mode === state.mode));
  document.querySelectorAll('.options .field[data-for]').forEach(f => {
    f.classList.toggle('hidden', !f.dataset.for.split(' ').includes(state.mode));
  });
  document.querySelectorAll('#o-days .day').forEach(b => b.classList.toggle('active', state.days.has(parseInt(b.dataset.d, 10))));
  if (state.mode === 'hours') {
    els.nLabel.textContent = 'Каждые (часов)';
    els.n.max = 23;
    if (parseInt(els.n.value, 10) > 23) els.n.value = 6;
  } else if (state.mode === 'minutes') {
    els.nLabel.textContent = 'Каждые (минут)';
    els.n.max = 59;
  }
}

function setMode(mode) {
  state.mode = mode;
  if (mode === 'minutes' && parseInt(els.n.value, 10) === 6) els.n.value = 15;
  syncModeUI();
  applyPreset();
}

document.querySelectorAll('#modes .chip').forEach(c => c.addEventListener('click', () => setMode(c.dataset.mode)));

document.querySelectorAll('#o-days .day').forEach(b => b.addEventListener('click', () => {
  const d = parseInt(b.dataset.d, 10);
  if (!state.daysTouched) {
    state.daysTouched = true;
    state.days = new Set([d]);
  } else if (state.days.has(d)) {
    if (state.days.size > 1) state.days.delete(d);
  } else {
    state.days.add(d);
  }
  syncModeUI();
  applyPreset();
}));

[els.time, els.odom, els.n].forEach(el => el.addEventListener('input', applyPreset));

[els.bTenant, els.bOld, els.bNew].forEach(el => el.addEventListener('input', render));

function showToast() {
  els.toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => els.toast.classList.remove('show'), 1400);
}

document.querySelectorAll('button.copy').forEach(btn => {
  btn.addEventListener('click', async () => {
    const sel = btn.getAttribute('data-copy');
    const text = document.querySelector(sel).textContent;
    try {
      await navigator.clipboard.writeText(text);
      showToast();
    } catch (e) {
      const range = document.createRange();
      range.selectNodeContents(document.querySelector(sel));
      const sel2 = window.getSelection();
      sel2.removeAllRanges();
      sel2.addRange(range);
    }
  });
});

syncModeUI();
applyPreset();
</script>
</body>
</html>
